name: Record 4K Intro Video

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duração da gravação em segundos (ex: 60)'
        required: true
        default: '60'

jobs:
  record-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4

      - name: Checkout Private Repository (Para obter o HTML)
        uses: actions/checkout@v4
        with:
          repository: 'Filipe-Lunfuankenda/analise-topologica-sinais-cerebrais' # Substitua se necessário
          token: ${{ secrets.PAT_TOKEN }}
          path: 'private_repo'

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Renderizar Vídeo Frame-a-Frame (Método À Prova de Bala)
        run: |
          # 1. Instalar as bibliotecas locais em vez de globais
          npm install timecut puppeteer
          
          # 2. Criar um mini-script Node na hora para forçar os argumentos à força
          cat << 'EOF' > render.js
          const timecut = require('timecut');
          timecut({
            url: 'file://' + process.cwd() + '/private_repo/scratch/SynapseTDA_Intro.html',
            viewport: { width: 3840, height: 2160 },
            fps: 60,
            duration: parseInt(process.env.VIDEO_DURATION) || 60,
            output: 'SynapseTDA_Intro_4K.mp4',
            puppeteerLaunchArgs: [
              '--no-sandbox', 
              '--disable-setuid-sandbox', 
              '--disable-dev-shm-usage', 
              '--disable-gpu',
              '--disable-translate',
              '--disable-features=TranslateUI'
            ],
            videoCodec: 'libx264',
            videoBitrate: '50M'
          }).then(() => {
            console.log('✅ Vídeo Renderizado com Sucesso Absoluto!');
          }).catch(err => { 
            console.error('❌ Falha na renderização:', err); 
            process.exit(1); 
          });
          EOF
          
          # 3. Executar o nosso script
          echo "A invocar o motor de renderização cinemática..."
          export VIDEO_DURATION=${{ github.event.inputs.duration }}
          node render.js

      - name: Upload do Vídeo para Download
        uses: actions/upload-artifact@v4
        with:
          name: SynapseTDA_Intro_4K_Video
          path: SynapseTDA_Intro_4K.mp4
