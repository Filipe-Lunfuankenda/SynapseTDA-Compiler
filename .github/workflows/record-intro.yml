name: Record 4K Intro Video

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duração da gravação em segundos (ex: 60)'
        required: true
        default: '60'

jobs:
  record-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4

      - name: Checkout Private Repository (Para obter o HTML)
        uses: actions/checkout@v4
        with:
          repository: 'Filipe-Lunfuankenda/analise-topologica-sinais-cerebrais' # Substitua se necessário
          token: ${{ secrets.PAT_TOKEN }}
          path: 'private_repo'

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Renderizar Vídeo Frame-a-Frame (Qualidade Extrema 4K)
        run: |
          npm install -g timecut
          
          echo "A renderizar 4K a 60FPS frame-a-frame..."
          # Adicionámos --disable-dev-shm-usage para impedir o Chrome de esgotar a RAM e rebentar
          # Adicionámos --disable-gpu para forçar a renderização a CPU limpa
          timecut "file://$PWD/private_repo/scratch/SynapseTDA_Intro.html" \
            --viewport=3840,2160 \
            --fps=60 \
            --duration=${{ github.event.inputs.duration }} \
            --output=SynapseTDA_Intro_4K.mp4 \
            --puppeteer-launch-args="--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu,--disable-translate,--disable-features=TranslateUI" \
            --video-codec=libx264 \
            --video-bitrate=50M

      - name: Upload do Vídeo para Download
        uses: actions/upload-artifact@v4
        with:
          name: SynapseTDA_Intro_4K_Video
          path: SynapseTDA_Intro_4K.mp4
